name: Terraform Deployment to AWS

on:
  workflow_dispatch:
    inputs:
      workspace:
        description: 'Select the Terraform workspace'
        required: true
        default: 'staging'
        type: choice
        options:
          - 'staging'
          - 'production'
      destroy:
        description: 'Set true to destroy the environment'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.11.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: GitHubActions-${{ github.run_id }}
          role-duration-seconds: 3600

      - name: Terraform Init
        run: terraform init

      - name: Select or Create Workspace
        run: |
          WS="${{ github.event.inputs.workspace }}"
          if ! terraform workspace list | grep -qw "$WS"; then
            terraform workspace new "$WS"
          else
            terraform workspace select "$WS"
          fi

      - name: Set DB password for workspace
        run: |
          if [[ "${{ github.event.inputs.workspace }}" == "staging" ]]; then
            echo "TF_VAR_db_password=${{ secrets.STAG_DB_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "TF_VAR_db_password=${{ secrets.PROD_DB_PASSWORD }}" >> $GITHUB_ENV
          fi

      - name: Terraform Apply or Destroy
        run: |
          WS="${{ github.event.inputs.workspace }}"
          VAR_FILE="-var-file=environments/${WS}/values.tfvars"
          if [[ "${{ github.event.inputs.destroy }}" == "true" ]]; then
            terraform destroy -var-file="$VAR_FILE" -auto-approve
          else
            terraform apply -var-file="$VAR_FILE" -auto-approve
          fi
